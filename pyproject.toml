[project]
name = "ssi"
version = "0.1.0"
description = "Site Safety Intelligence: OSHA subcontractor safety history for general contractors"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.4.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8",
  "anthropic>=0.60",
  "langsmith>=0.3",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "modal>=1.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ssi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
